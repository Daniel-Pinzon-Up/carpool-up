name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carpool
          POSTGRES_PASSWORD: carpool
          POSTGRES_DB: carpool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carpool"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://carpool:carpool@localhost:5432/carpool_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tipos
        run: uv run mypy app
      - name: Migraciones
        run: uv run alembic upgrade head
      - name: Pruebas
        run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx ng lint && npx prettier --check "src/**/*.{ts,html,css}"
      - name: Pruebas
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  e2e:
    # Stack completo con make up, como en un equipo nuevo, y la suite de Playwright: recorrido
    # de punta a punta, ciclo de vida de una cuenta y axe en 24 pantallas (Chrome del runner).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Datos de OSRM en cache
        id: osrm
        uses: actions/cache@v4
        with:
          path: infra/osrm/data
          key: osrm-${{ hashFiles('infra/scripts/build_osrm.sh', 'infra/osrm/clip.py') }}
      - name: Datos de OSRM
        if: steps.osrm.outputs.cache-hit != 'true'
        run: make osrm
      - name: Levantar la app
        run: make up
      - name: Datos semilla y cuentas de prueba
        run: make seed && make e2e-users
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Pruebas E2E
        run: npx playwright test
        working-directory: frontend
      - name: Resultados de las pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
      - name: Logs del stack
        if: failure()
        run: make ps && docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml logs --tail=200

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Imagen del backend
        run: docker build -t carpool-api backend
      - name: Imagen web
        run: docker build -t carpool-web -f frontend/Dockerfile .
