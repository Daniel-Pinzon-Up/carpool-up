name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: carpool
          POSTGRES_PASSWORD: carpool
          POSTGRES_DB: carpool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carpool"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://carpool:carpool@localhost:5432/carpool_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tipos
        run: uv run mypy app
      - name: Migraciones
        run: uv run alembic upgrade head
      - name: Pruebas
        run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx ng lint && npx prettier --check "src/**/*.{ts,html,css}"
      - name: Pruebas
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Imagen del backend
        run: docker build -t carpool-api backend
      - name: Imagen web
        run: docker build -t carpool-web -f frontend/Dockerfile .
