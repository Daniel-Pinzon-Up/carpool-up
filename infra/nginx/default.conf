# HTTPS es obligatorio: la geolocalizacion del navegador solo funciona en contexto seguro.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;

    # El nombre "api" se resuelve en cada peticion (DNS de Docker, cache de 10 s). Con un
    # proxy_pass fijo Nginx guarda la IP del arranque y, si el contenedor del API se recrea
    # con otra IP, todas las llamadas responden 502 hasta reiniciar Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Nginx es el borde: X-Forwarded-For se REEMPLAZA con la IP real. Si se agregara a la que
    # mande el cliente, el API (que confia en esta cabecera) tomaria una IP inventada y el
    # limite de intentos de inicio de sesion se podria esquivar cambiandola en cada intento.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # Teselas PMTiles: Nginx atiende peticiones por rangos de forma nativa.
    location /tiles/ {
        alias /srv/tiles/;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        add_header Accept-Ranges bytes;
    }

    # Script de arranque sin hash en el nombre: siempre se revalida.
    location = /theme-init.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Imagenes de marca sin hash en el nombre: pueden cambiar, cache de un dia.
    location ^~ /brand/ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Recursos con hash en el nombre: cache larga.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /i18n/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
