# Base comun a todos los entornos. Desarrollo agrega docker-compose.dev.yml.
name: carpool

x-backend: &backend
  build:
    context: ../backend
  env_file: ../.env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - storage:/data/storage

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ['arq', 'app.workers.main.WorkerSettings']

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - certs:/etc/nginx/certs
      - ./tiles:/srv/tiles:ro
    depends_on:
      api:
        condition: service_healthy

  # Respaldo diario con pg_dump; conserva los ultimos 7.
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ../backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      db:
        condition: service_healthy

  # Rutas. Requiere los datos generados con `make osrm` (paso 5).
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ['osrm']
    restart: unless-stopped
    command: ['osrm-routed', '--algorithm', 'mld', '/data/pamplona.osrm']
    volumes:
      - ./osrm/data:/data:ro

volumes:
  db_data:
  redis_data:
  storage:
  certs:
